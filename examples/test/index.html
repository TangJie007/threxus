<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FactoryTwin · 智能工厂数字孪生</title>
    <style>
      :root {
        --bg: #0a0f16;
        --panel: rgba(12, 20, 30, 0.82);
        --line: rgba(64, 224, 255, 0.18);
        --cyan: #40e0ff;
        --ok: #2ee6a8;
        --warn: #ffb020;
        --err: #ff4d5e;
        --idle: #7d8ea3;
        --text: #d6e4f0;
        --dim: #7d8ea3;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.6 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      #canvas-host { position: absolute; inset: 0; }
      #canvas-host canvas { display: block; outline: none; }

      /* CSS2D 标签层：必须穿透点击，否则会挡住 3D 拾取 */
      #label-host { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

      /* ---------- HUD ---------- */
      .hud { position: absolute; pointer-events: none; z-index: 10; }
      .hud > * { pointer-events: auto; }

      .topbar {
        top: 0; left: 0; right: 0; height: 52px;
        display: flex; align-items: center; gap: 18px;
        padding: 0 18px;
        background: linear-gradient(180deg, rgba(8,14,22,.94), rgba(8,14,22,0));
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .5px; }
      .brand .dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--cyan); box-shadow: 0 0 12px var(--cyan);
        animation: pulse 2s infinite;
      }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
      .brand small { color: var(--dim); font-weight: 400; letter-spacing: 2px; }
      .topbar .spacer { flex: 1; }
      .kpi { display: flex; gap: 22px; }
      .kpi .item { text-align: right; }
      .kpi .item b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
      .kpi .item span { font-size: 11px; color: var(--dim); }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0,0,0,.45);
      }
      .panel h3 {
        font-size: 12px; font-weight: 600; letter-spacing: 1px;
        padding: 10px 14px; color: var(--cyan);
        border-bottom: 1px solid var(--line);
        display: flex; align-items: center; justify-content: space-between;
      }
      .panel h3 em { font-style: normal; color: var(--dim); font-size: 11px; }

      #panel-left { top: 66px; left: 14px; width: 244px; max-height: calc(100% - 140px); display: flex; flex-direction: column; }
      #device-list { overflow-y: auto; padding: 6px; }
      .dev {
        display: flex; align-items: center; gap: 9px;
        padding: 7px 9px; border-radius: 6px; cursor: pointer;
        border: 1px solid transparent; transition: background .15s, border-color .15s;
      }
      .dev:hover { background: rgba(64,224,255,.08); }
      .dev.active { background: rgba(64,224,255,.14); border-color: var(--line); }
      .dev .led { width: 7px; height: 7px; border-radius: 50%; flex: none; }
      .dev .name { flex: 1; font-size: 12px; }
      .dev .val { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }

      #panel-right { top: 66px; right: 14px; width: 258px; display: none; }
      #detail-body { padding: 12px 14px; }
      .kv { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed rgba(125,142,163,.18); }
      .kv:last-child { border: 0; }
      .kv span { color: var(--dim); font-size: 12px; }
      .kv b { font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
      .bar { height: 4px; border-radius: 2px; background: rgba(125,142,163,.25); overflow: hidden; margin-top: 4px; }
      .bar i { display: block; height: 100%; background: var(--cyan); transition: width .4s ease; }

      /* ---------- CSS2D 标签 ---------- */
      .tag {
        transform: translate(-50%, -50%);
        white-space: nowrap;
        padding: 3px 9px 3px 7px;
        font-size: 11px; line-height: 1.4;
        border-radius: 4px;
        background: rgba(8,16,24,.86);
        border: 1px solid var(--line);
        color: var(--text);
        display: flex; align-items: center; gap: 6px;
        cursor: pointer;
        transition: opacity .2s;
        user-select: none;
      }
      .tag .led { width: 6px; height: 6px; border-radius: 50%; }
      .tag::after {
        content: ''; position: absolute; left: 50%; bottom: -14px;
        width: 1px; height: 14px; background: linear-gradient(180deg, var(--cyan), transparent);
        transform: translateX(-50%);
      }
      .tag { position: relative; }

      .s-ok   { color: var(--ok); }   .s-ok   .led { background: var(--ok);   box-shadow: 0 0 8px var(--ok); }
      .s-warn { color: var(--warn); } .s-warn .led { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
      .s-err  { color: var(--err); }  .s-err  .led { background: var(--err);  box-shadow: 0 0 8px var(--err); }
      .s-idle { color: var(--idle); } .s-idle .led { background: var(--idle); }

      .led-ok   { background: var(--ok);   box-shadow: 0 0 8px var(--ok); }
      .led-warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
      .led-err  { background: var(--err);  box-shadow: 0 0 8px var(--err); }
      .led-idle { background: var(--idle); }

      /* ---------- 底部工具条 ---------- */
      .toolbar {
        bottom: 14px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 6px;
      }
      .toolbar button {
        background: transparent; border: 1px solid transparent; color: var(--dim);
        padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px;
        font-family: inherit; transition: all .15s;
      }
      .toolbar button:hover { color: var(--text); background: rgba(64,224,255,.08); }
      .toolbar button.on { color: var(--cyan); border-color: var(--line); background: rgba(64,224,255,.12); }

      .statusbar {
        bottom: 14px; left: 14px; font-size: 11px; color: var(--dim);
        display: flex; gap: 14px; font-variant-numeric: tabular-nums;
      }

      /* ---------- Loading ---------- */
      #loading {
        position: absolute; inset: 0; z-index: 100;
        background: var(--bg);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        transition: opacity .5s;
      }
      #loading.hide { opacity: 0; pointer-events: none; }
      #loading .ring {
        width: 46px; height: 46px; border-radius: 50%;
        border: 2px solid rgba(64,224,255,.15); border-top-color: var(--cyan);
        animation: spin .9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg) } }
      #loading p { color: var(--dim); font-size: 12px; letter-spacing: 1px; }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: rgba(64,224,255,.22); border-radius: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-host"></div>
      <div id="label-host"></div>

      <div class="hud topbar">
        <div class="brand">
          <i class="dot"></i>
          FactoryTwin <small>DIGITAL TWIN</small>
        </div>
        <div class="spacer"></div>
        <div class="kpi">
          <div class="item"><b id="kpi-run">0</b><span>运行中</span></div>
          <div class="item"><b id="kpi-warn" style="color:var(--warn)">0</b><span>告警</span></div>
          <div class="item"><b id="kpi-err" style="color:var(--err)">0</b><span>故障</span></div>
          <div class="item"><b id="kpi-oee">0%</b><span>综合效率</span></div>
        </div>
      </div>

      <div class="hud panel" id="panel-left">
        <h3>设备清单 <em id="dev-count">0 台</em></h3>
        <div id="device-list"></div>
      </div>

      <div class="hud panel" id="panel-right">
        <h3>设备详情 <em id="detail-close" style="cursor:pointer">✕</em></h3>
        <div id="detail-body"></div>
      </div>

      <div class="hud panel toolbar" id="toolbar">
        <button data-mode="orbit" class="on">环绕</button>
        <button data-mode="roam">巡检</button>
        <button data-toggle="outline">描边</button>
        <button data-toggle="bloom">辉光</button>
        <button data-toggle="ao">AO</button>
        <button data-toggle="flow">流向</button>
        <button data-toggle="fence">围栏</button>
        <button data-toggle="clip">剖切</button>
        <button data-toggle="labels" class="on">标签</button>
      </div>

      <div class="hud statusbar">
        <span>FPS <b id="st-fps" style="color:var(--text)">0</b></span>
        <span>Draw <b id="st-calls" style="color:var(--text)">0</b></span>
        <span>Tri <b id="st-tris" style="color:var(--text)">0</b></span>
        <span>Geo <b id="st-geo" style="color:var(--text)">0</b></span>
        <span>Tex <b id="st-tex" style="color:var(--text)">0</b></span>
      </div>

      <div id="loading"><div class="ring"></div><p>正在构建孪生场景…</p></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
